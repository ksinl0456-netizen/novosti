<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Новости</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f3f4f6;color:#1f2328}
header{position:sticky;top:0;z-index:2;background:#fff;padding:10px 14px;border-bottom:1px solid #d0d7de}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font-size:15px;padding:7px 8px;border:1px solid #afb8c1;border-radius:6px;background:#fff}
input[type=search]{flex:1;min-width:160px}
details{margin-top:8px}
summary{cursor:pointer;font-size:14px;color:#0b63c5}
.chans{margin-top:6px}
.chans label{display:inline-block;margin:3px 12px 3px 0;font-size:14px}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.info{font-size:13px;color:#57606a;margin:2px 0 10px}
.card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.meta{font-size:13px;color:#57606a;margin-bottom:5px}
.title{font-weight:600;font-size:16px;line-height:1.35;margin-bottom:6px}
.text{font-size:15px;line-height:1.5;white-space:pre-line}
.foot{font-size:13px;margin-top:8px}
.foot a{color:#0b63c5}
.tr{color:#9a5b00}
.empty{text-align:center;color:#57606a;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>Новости</h1>
  <div class="row">
    <input type="date" id="from" aria-label="С даты">
    <input type="date" id="to" aria-label="По дату">
  </div>
  <div class="row" style="margin-top:8px">
    <input type="search" id="q" placeholder="Поиск по словам">
  </div>
  <details>
    <summary>Каналы (отметьте нужные)</summary>
    <div class="chans" id="chans"></div>
  </details>
</header>
<main>
  <div class="info" id="info">Загрузка...</div>
  <div id="list"></div>
</main>
<script>
const BASE = "data/";
const OFF_KEY = "novosti_off_channels";
let index = null;
let items = [];
let rangeKey = "";

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const shift = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const offSet = () => new Set(JSON.parse(localStorage.getItem(OFF_KEY) || "[]"));

async function getJSON(url) {
  const r = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(url);
  return r.json();
}

async function loadRange() {
  const a = document.getElementById("from").value;
  const b = document.getElementById("to").value;
  if (!a || !b) return;
  const key = a + "|" + b;
  rangeKey = key;
  document.getElementById("info").textContent = "Загрузка...";
  const days = index.days.map(x => x.day).filter(d => d >= shift(a, -1) && d <= shift(b, 1));
  const parts = await Promise.all(days.map(d => getJSON(BASE + d + ".json").catch(() => [])));
  if (key !== rangeKey) return;
  items = parts.flat();
  renderChannels();
  render();
}

function renderChannels() {
  const names = {};
  items.forEach(it => { names[it.ch] = it.name; });
  const off = offSet();
  const box = document.getElementById("chans");
  box.innerHTML = "";
  Object.keys(names).sort().forEach(ch => {
    const lab = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !off.has(ch);
    cb.addEventListener("change", () => {
      const s = offSet();
      if (cb.checked) { s.delete(ch); } else { s.add(ch); }
      localStorage.setItem(OFF_KEY, JSON.stringify([...s]));
      render();
    });
    lab.appendChild(cb);
    lab.append(" " + names[ch]);
    box.appendChild(lab);
  });
}

function card(it) {
  const when = new Date(it.date).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const lines = it.text.split("\n").map(s => s.trim()).filter(Boolean);
  let title = lines[0] || "";
  let body = lines.slice(1).join("\n");
  if (lines.length === 1 && title.length > 140) {
    const m = title.match(/^(.{20,140}?[.!?»])\s+([\s\S]*)$/);
    if (m) {
      title = m[1];
      body = m[2];
    } else {
      const cut = title.slice(0, 137).replace(/\s+\S*$/, "");
      body = title.slice(cut.length).trim();
      title = cut + "…";
    }
  }
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML =
    '<div class="meta">' + esc(when) + ' · ' + esc(it.name) +
      (it.tr ? ' · <span class="tr">машинный перевод</span>' : '') + '</div>' +
    '<div class="title">' + esc(title) + '</div>' +
    (body ? '<div class="text">' + esc(body) + '</div>' : '') +
    '<div class="foot"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">Открыть в Telegram</a></div>';
  return el;
}

function render() {
  const a = document.getElementById("from").value;
  const b = document.getElementById("to").value;
  const q = document.getElementById("q").value.trim().toLowerCase();
  const off = offSet();
  const list = items
    .filter(it => {
      const day = ymd(new Date(it.date));
      return day >= a && day <= b && !off.has(it.ch) && (!q || it.text.toLowerCase().includes(q));
    })
    .sort((x, y) => new Date(x.date) - new Date(y.date));
  const wrap = document.getElementById("list");
  wrap.innerHTML = "";
  let info = "Показано: " + list.length;
  if (index && index.updated) info += " · архив обновлён " + new Date(index.updated).toLocaleString("ru-RU");
  document.getElementById("info").textContent = info;
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">Нет новостей по выбранным условиям</div>';
    return;
  }
  list.forEach(it => wrap.appendChild(card(it)));
}

document.getElementById("q").addEventListener("input", render);
["from", "to"].forEach(id => document.getElementById(id).addEventListener("change", loadRange));

(async () => {
  try {
    index = await getJSON(BASE + "index.json");
  } catch (e) {
    document.getElementById("info").textContent = "Архив пока не найден. Сбор ещё не запускался.";
    return;
  }
  const today = ymd(new Date());
  let day = today;
  if (!index.days.some(x => x.day === today) && index.days.length) day = index.days[0].day;
  document.getElementById("from").value = day;
  document.getElementById("to").value = day;
  loadRange();
})();
</script>
</body>
</html>
