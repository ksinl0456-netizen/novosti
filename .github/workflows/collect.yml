name: Сбор новостей

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать новости
        run: python collect.py

      - name: Сохранить изменения
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "новых новостей нет"
          else
            git commit -m "новости: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
